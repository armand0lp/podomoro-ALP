<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pomodoro ALP</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body { margin: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #000000; color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden; transition: background-color 0.5s ease; position: relative; touch-action: manipulation; }
        #cycle-indicator { position: absolute; top: 24px; right: 32px; font-size: 0.9rem; color: #666666; letter-spacing: 2px; text-transform: uppercase; }
        #timer { font-size: 25vw; font-weight: bold; line-height: 1; margin: 0; letter-spacing: -2px; }
        #status { font-size: 1.5rem; margin-bottom: 2rem; text-transform: uppercase; letter-spacing: 4px; color: #666666; }
        .controls { display: flex; gap: 1.5rem; margin-top: 3rem; }
        button { background: none; border: 1px solid #333333; color: #ffffff; padding: 12px 24px; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; border-radius: 4px; transition: all 0.3s ease; }
        button:hover { border-color: #ffffff; background-color: rgba(255, 255, 255, 0.1); }
        @keyframes pulseAlert { 0% { background-color: #000000; } 50% { background-color: #333333; } 100% { background-color: #000000; } }
        .time-up { animation: pulseAlert 1.5s ease-in-out 3; }
        @media (max-width: 600px) { #timer { font-size: 35vw; } .controls { flex-wrap: wrap; justify-content: center; } }
    </style>
</head>
<body>
    <div id="cycle-indicator">Bloque 1/4</div>
    <div id="status">Trabajo</div>
    <div id="timer">25:00</div>
    <div class="controls">
        <button id="startBtn">Iniciar</button>
        <button id="pauseBtn">Pausar</button>
        <button id="skipBtn">Siguiente</button>
        <button id="resetBtn">Reiniciar</button>
    </div>

    <script>
        const timerDisplay = document.getElementById('timer');
        const statusDisplay = document.getElementById('status');
        const cycleIndicator = document.getElementById('cycle-indicator');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const skipBtn = document.getElementById('skipBtn');
        const resetBtn = document.getElementById('resetBtn');

        const alertSound = new Audio('notificacion.mp3');

        const WORK_TIME = 25 * 60;
        const SHORT_BREAK = 5 * 60;
        const LONG_BREAK = 15 * 60;

        let timeLeft = WORK_TIME;
        let timerId = null;
        let isRunning = false;
        let cycles = 0;
        let currentMode = 'work';

        function playSound() {
            alertSound.currentTime = 0;
            alertSound.play().catch(() => console.log("Audio bloqueado. Interactúa con la app primero."));
        }

        function showNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, {
                    body: body,
                    icon: 'icon-192.png'
                });
            }
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            const currentBlock = (cycles % 4) + 1;
            cycleIndicator.textContent = `Bloque ${currentBlock}/4`;
        }

        function triggerAnimation() {
            document.body.classList.remove('time-up');
            void document.body.offsetWidth;
            document.body.classList.add('time-up');
        }

        function switchMode() {
            playSound();
            triggerAnimation();
            let notifTitle = '';
            let notifBody = '';

            if (currentMode === 'work') {
                cycles++;
                if (cycles > 0 && cycles % 4 === 0) {
                    currentMode = 'longBreak';
                    timeLeft = LONG_BREAK;
                    statusDisplay.textContent = 'Descanso Largo';
                    notifTitle = '¡Excelente, Armando!';
                    notifBody = 'Es momento de tu descanso largo de 15 minutos.';
                } else {
                    currentMode = 'shortBreak';
                    timeLeft = SHORT_BREAK;
                    statusDisplay.textContent = 'Descanso Corto';
                    notifTitle = '¡Bloque terminado!';
                    notifBody = 'Toma un descanso corto de 5 minutos.';
                }
            } else {
                currentMode = 'work';
                timeLeft = WORK_TIME;
                statusDisplay.textContent = 'Trabajo';
                notifTitle = '¡A trabajar!';
                notifBody = 'Iniciando bloque de 25 minutos de concentración.';
                if (cycles > 0 && cycles % 4 === 0) {
                    cycles = 0;
                }
            }
            updateDisplay();
            pauseTimer();
            showNotification(notifTitle, notifBody);
        }

        function startTimer() {
            if (isRunning) return;
            playSound();
            isRunning = true;
            timerId = setInterval(() => {
                timeLeft--;
                updateDisplay();
                if (timeLeft <= 0) {
                    switchMode();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerId);
        }

        function skipTimer() {
            pauseTimer();
            switchMode();
        }

        function resetTimer() {
            pauseTimer();
            currentMode = 'work';
            cycles = 0;
            timeLeft = WORK_TIME;
            statusDisplay.textContent = 'Trabajo';
            document.body.classList.remove('time-up');
            updateDisplay();
        }

        startBtn.addEventListener('click', () => {
            // Solicitar permisos de notificación la primera vez que se inicia
            if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
                Notification.requestPermission();
            }
            startTimer();
        });

        pauseBtn.addEventListener('click', pauseTimer);
        skipBtn.addEventListener('click', skipTimer);
        resetBtn.addEventListener('click', resetTimer);

        updateDisplay();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registrado', reg))
                    .catch(err => console.log('SW error', err));
            });
        }
    </script>
</body>
</html>
